[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-gps-sim"
version = "0.1.0"
description = "Simulatore di posizione GPS per iPhone via USB, alternativa open source a GhostMe"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Pin voluto: vedi requirements.txt.
    "pymobiledevice3==10.4.0",
]

[project.scripts]
gpssim = "gpssim.cli:main"

[tool.setuptools]
packages = ["gpssim"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
